<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDiary - Secure Manager</title>
    <!-- Custom Favicon -->
    <link rel="icon" type="image/png" href="ojhag.png">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    
    <link rel="stylesheet" href="HomeStyle.css">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Cloudinary Upload Widget v2 -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>
    <!-- Supabase Auth Login Screen -->
    <div id="auth-screen" class="lock-overlay">
        <div class="lock-box">
            <h2>🔒 MyVault Login</h2>
            <p>Enter your credentials to access your secure vault.</p>
            <form id="auth-form" onsubmit="handleLogin(event)">
                <input type="email" id="auth-email" placeholder="Email Address" required>
                <div class="password-wrapper" style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="auth-password" placeholder="Password" required style="width: 100%; padding-right: 40px;">
                    <button type="button" onclick="toggleLoginPassword()" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 1.1rem;" title="Show/Hide Password">👁️</button>
                </div>
                <button type="submit" id="auth-submit-btn" class="primary-btn">Login to Vault</button>
            </form>
            <p id="auth-error" class="status-text" style="color: #f87171; display: none; margin-top: 8px;"></p>
        </div>
    </div>

    <!-- Main App Container (Hidden by default until authenticated) -->
    <div class="container" id="main-app" style="display: none;">
        <header>
            <h1>🔒 MyVault & Manager</h1>
            <p>Secure Personal Files & Secrets Manager</p>
            <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
                <button onclick="openChangePasswordModal()" class="secondary-btn" style="padding: 4px 10px; font-size: 0.8rem;">🔑 Change Password</button>
                <button onclick="handleLogout()" class="secondary-btn" style="padding: 4px 10px; font-size: 0.8rem; border-color: #f87171; color: #f87171;">🔒 Logout & Lock</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" onclick="switchTab('photos')">Photo Files</button>
            <button class="tab-btn" onclick="switchTab('pdfs')">PDF Files</button>
            <button class="tab-btn" onclick="switchTab('passwords')">Password Vault</button>
        </nav>

        <!-- Photo Files Section -->
        <section id="photos-section" class="tab-content active">
            <h2>Saved Photos</h2>
            <div id="photo-list" class="card-grid"></div>

            <h2>Add Photo File</h2>
            <form id="photo-form">
                <input type="text" id="photo-title" placeholder="Photo Title" required>
                <button type="button" id="photo-upload-btn" class="secondary-btn">📷 Select & Upload Photo</button>
                <p id="photo-file-status" class="status-text">No file chosen</p>
                <button type="submit" id="photo-submit-btn" class="primary-btn">Save Photo Entry</button>
            </form>
        </section>

        <!-- PDF Files Section -->
        <section id="pdfs-section" class="tab-content">
            <h2>Saved PDFs</h2>
            <div id="pdf-list" class="card-grid"></div>

            <h2>Add PDF File</h2>
            <form id="pdf-form">
                <input type="text" id="pdf-title" placeholder="PDF Title" required>
                <input type="file" id="pdf-file-input" accept="application/pdf" style="display: none;">
                <button type="button" id="pdf-upload-btn" class="secondary-btn">📄 Select PDF File</button>
                <p id="pdf-file-status" class="status-text">No file chosen</p>
                <button type="submit" id="pdf-submit-btn" class="primary-btn">Save PDF Entry</button>
            </form>
        </section>

        <!-- Password Vault Section -->
        <section id="passwords-section" class="tab-content">
            <h2>Stored Accounts & Secrets</h2>
            <div id="password-list" class="card-grid"></div>

            <h2 id="password-form-title">Add Account & Secrets</h2>
            <form id="password-form">
                <input type="hidden" id="edit-password-id" value="">
                <input type="text" id="site-name" placeholder="Account / Service Name (e.g., Bank, Github)" required>
                <div id="secrets-container">
                    <h3>Secret Fields</h3>
                </div>
                <button type="button" class="secondary-btn" onclick="addSecretRow()">➕ Add Variable Field</button>
                <button type="submit" id="password-submit-btn" class="primary-btn">Save Account Details</button>
            </form>
        </section>
    </div>

    <!-- Popup Modal for Previews, Secrets View, & Password Change -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modal-title">Details</h3>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="HomeScript.js"></script>
    
    <!-- Register Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered successfully:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
